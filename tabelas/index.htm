<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Tabelas</title>

    <!-- Link para o CSS -->
     <link rel="stylesheet" href="./css/global.css">
</head>
<body>
    <main class="main-content">
        <header class="header-title">
            <h1>Tabelas</h1>
            <h2>Notas 1DS - SESI</h2>
        </header>
        <!-- Container para criar uma tabela -->
        <table class="table-main">
            <!-- Criar uma linha na tabela (tr= table row) -->
             <tr>
                <!-- Criar uma cabeçalho da linha (th= table header) -->
                 <th>Aluno</th>
                 <th>Professor</th>
                 <th>Disciplina</th>
                 <th>Nota</th>
             </tr>
             <tr>
                <!-- Inserir dados na linha (td= table data) -->
                 <td>Ivo</td>
                 <td>Alex</td>
                 <td>BD</td>
                 <td>6</td>
             </tr>
             <tr>
                <td>Alex</td>
                <td>Ivo</td>
                <td>PEND</td>
                <td>7,5</td>
             </tr>
             <tr>
                <td>Júlia</td>
                <td>Juliano</td>
                <td>Filosofia</td>
                <td>10</td>
             </tr>
             <tr>
                <td>Palma</td>
                <td>Guiza</td>
                <td>Matemática</td>
                <td>8</td>
             </tr>
        </table>
    </main>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Tabelas</title>

    <!-- Link para o CSS -->
     <link rel="stylesheet" href="./css/global.css">
</head>
<body>
    <main class="main-content">
        <header class="header-title">
            <h1>Tabelas</h1>
        </header>
        <!-- Container para criar uma tabela -->
        <table class="table-alunos">
            <!-- Criar uma linha na tabela (tr= table row) -->
            <thead>
                <tr>
                    <th colspan="4" class="table-alunos__title">Notas 1DS - SESI</th>
                </tr>
                 <tr>
                <!-- Criar uma cabeçalho da linha (th= table header) -->
                 <th class="table-alunos__cabecalho">Aluno</th>
                 <th class="table-alunos__cabecalho">Professor</th>
                 <th class="table-alunos__cabecalho">Disciplina</th>
                 <th class="table-alunos__cabecalho">Nota</th>
             </tr>
            </thead>
            <tbody>
                <tr>
                <!-- Inserir dados na linha (td= table data) -->
                 <td>Ivo</td>
                 <td>Alex</td>
                 <td>BD</td>
                 <td>6</td>
             </tr>
             <tr>
                <td>Alex</td>
                <td>Ivo</td>
                <td>PEND</td>
                <td>7,5</td>
             </tr>
             <tr>
                <td>Júlia</td>
                <td>Juliano</td>
                <td>Filosofia</td>
                <td>10</td>
             </tr>
             <tr>
                <td>Palma</td>
                <td>Guiza</td>
                <td>Matemática</td>
                <td>8</td>
             </tr>
            </tbody>
            <tfoot>
                 <tr>
                    <td colspan="4">Dados referentes ao 1º semestre de 2026</td>
                </tr>
            </tfoot>  
        </table>
            
        <table class="table-notas">
            <tr>
                <th>Matéria</th>
                <th>1º Semestre</th>
                <th>2º Semestre</th>
                <th>3º Semestre</th>
                <th>Média</th>
            </tr>
            <tr>
                <td>Matemática</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Português</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Artes</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Filosofia</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>
    </main>
    
</body>
</html>
